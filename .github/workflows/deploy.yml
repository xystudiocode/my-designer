name: Deploy to GitHub Pages

on:
  # main 分支每次更新（push）即触发部署
  push:
    branches:
      - main
  # 支持在 Actions 页面手动触发
  workflow_dispatch:

# 部署到 GitHub Pages 所需的最小权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一个部署任务；新的推送会取消正在进行的部署
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # 项目站点地址为 https://xystudiocode.github.io/my-designer/
          DEPLOY_BASE: /my-designer/

      # history 路由模式下，直接访问子路径（如 /about）时由 404.html 兜底
      - name: Add SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # 若仓库尚未启用 Pages，则首次运行时自动启用
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
